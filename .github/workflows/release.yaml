name: release

on:
  push:
    tags:
      - '[0-9]*'

permissions:
  contents: write

jobs:
  build:
    name: Build & Pack
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true
          fetch-depth: 0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: "./global.json"

      - name: Restore .NET tools
        run: dotnet tool restore

      - name: Update release notes
        shell: pwsh
        run: ./build.ps1

      - name: Extract version from tag
        shell: bash
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: dotnet build -c Release

      - name: Pack
        run: dotnet pack -c Release -o ./bin/nuget

      - name: Extract latest release notes
        shell: pwsh
        run: |
          $content = Get-Content RELEASE_NOTES.md -Raw
          # Match from the first #### heading to just before the second one
          if ($content -match '(?s)(####.+?)(?=\n####|\z)') {
            $Matches[1].Trim() | Set-Content RELEASE_NOTES_LATEST.md
          } else {
            $content | Set-Content RELEASE_NOTES_LATEST.md
          }

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-unsigned
          path: bin/nuget/*
          if-no-files-found: error

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES_LATEST.md
          if-no-files-found: error

  sign:
    name: Sign NuGet Packages
    needs: build
    runs-on: windows-latest
    environment: signing
    permissions:
      id-token: write  # required for workload identity federation (OIDC signing)
    env:
      CODE_SIGN_KEY_VAULT: ${{ secrets.CODE_SIGN_KEY_VAULT }}

    steps:
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install NuGet signing tool
        run: dotnet tool install --global sign --version 0.9.1-beta.26102.1

      - name: Download unsigned packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-unsigned
          path: bin/nuget

      - name: Azure login (workload identity federation)
        if: env.CODE_SIGN_KEY_VAULT != ''
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign NuGet packages
        if: env.CODE_SIGN_KEY_VAULT != ''
        shell: pwsh
        run: |
          sign code azure-key-vault `
            "**/*.nupkg" `
            --base-directory "$env:GITHUB_WORKSPACE/bin/nuget" `
            --publisher-name "Petabridge" `
            --description "TurboMqtt" `
            --description-url "https://github.com/petabridge/TurboMqtt" `
            --azure-key-vault-certificate "${{ secrets.CODE_SIGN_CERT_NAME }}" `
            --azure-key-vault-url "${{ secrets.CODE_SIGN_KEY_VAULT }}" `
            -v Information

      - name: Upload signed packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-signed
          path: bin/nuget/*
          if-no-files-found: error

  publish-nuget:
    name: Publish to NuGet.org
    needs: sign
    runs-on: windows-latest

    steps:
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Download signed packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-signed
          path: bin/nuget

      - name: Push to NuGet.org
        shell: pwsh
        run: |
          dotnet nuget push "$env:GITHUB_WORKSPACE\bin\nuget\*.nupkg" `
            --api-key ${{ secrets.NUGET_API_KEY }} `
            --source https://api.nuget.org/v3/index.json `
            --skip-duplicate

  publish-github:
    name: Create GitHub Release
    needs: publish-nuget
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Extract version from tag
        shell: bash
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Download signed packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-signed
          path: bin/nuget

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "TurboMqtt v${{ steps.version.outputs.version }}"
          body_path: RELEASE_NOTES_LATEST.md
          files: |
            bin/nuget/*.nupkg
            bin/nuget/*.snupkg
